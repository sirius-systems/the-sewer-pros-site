<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Residential sewer lateral and public sewer main</title>
  <desc id="map-desc">A side-view educational cutaway of a St. Louis-area home showing one sewer lateral running from the building, beneath the yard and sidewalk, to a public sewer main under the street. The property boundary is shown for orientation only.</desc>

  <defs>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 25px; font-weight: 650; fill: #0B2D45; }
      .small { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #385363; }
      .leader { fill: none; stroke: #718895; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #007A3D; stroke: #FFFFFF; stroke-width: 4; }
      .boundary { fill: none; stroke: #007A3D; stroke-width: 4; stroke-dasharray: 12 10; }
    </style>
    <marker id="flow-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#007A3D"/>
    </marker>
  </defs>

  <g id="background">
    <rect width="1600" height="1200" fill="#FCFBF7"/>
    <rect y="632" width="1600" height="568" fill="#E7D8BF"/>
    <path d="M0 735 C270 720 485 750 745 728 C1010 706 1290 744 1600 716 L1600 1200 L0 1200 Z" fill="#DDC9A9" opacity="0.7"/>
    <path d="M0 875 C285 852 545 896 813 870 C1080 844 1320 882 1600 858" fill="none" stroke="#CFB58F" stroke-width="3" opacity="0.55"/>
    <path d="M0 1035 C320 1012 565 1054 855 1027 C1120 1002 1350 1035 1600 1018" fill="none" stroke="#CFB58F" stroke-width="3" opacity="0.42"/>
  </g>

  <g id="surface-context">
    <path d="M0 598 H1050 V632 H0 Z" fill="#6F9C62"/>
    <path d="M0 588 C170 574 355 600 530 586 C700 572 872 598 1050 584 V616 H0 Z" fill="#7FAC72"/>

    <g id="sidewalk">
      <rect x="1048" y="570" width="188" height="62" rx="4" fill="#D7E0E5" stroke="#AAB8C0" stroke-width="3"/>
      <path d="M1110 572 V630 M1174 572 V630" stroke="#B9C5CB" stroke-width="3"/>
    </g>

    <g id="curb-and-street">
      <path d="M1236 565 H1270 V630 H1236 Z" fill="#BBC7CD" stroke="#9EADB5" stroke-width="3"/>
      <path d="M1270 548 H1600 V632 H1270 Z" fill="#596873"/>
      <path d="M1270 606 H1600" stroke="#445560" stroke-width="4"/>
      <path d="M1370 588 H1504" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.72"/>
    </g>

    <g id="landscape" fill="#567E4C">
      <circle cx="670" cy="573" r="37"/>
      <circle cx="714" cy="581" r="29"/>
      <circle cx="760" cy="575" r="34"/>
      <path d="M886 607 C879 550 898 500 925 466 C950 507 956 559 948 608 Z" fill="#709B63"/>
      <path d="M907 604 C900 544 914 488 931 446" fill="none" stroke="#507645" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <g id="residential-home">
    <g id="house-exterior">
      <path d="M110 300 L365 122 L620 300 Z" fill="#9D4A38" stroke="#0B2D45" stroke-width="5" stroke-linejoin="round"/>
      <path d="M140 300 H590 V632 H140 Z" fill="#B75B45" stroke="#0B2D45" stroke-width="5"/>
      <path d="M170 322 H560" stroke="#D88B76" stroke-width="3" opacity="0.75"/>
      <path d="M170 374 H560 M170 426 H560 M170 478 H560" stroke="#D88B76" stroke-width="3" opacity="0.55"/>
      <rect x="212" y="350" width="104" height="120" rx="3" fill="#E9F2F5" stroke="#0B2D45" stroke-width="5"/>
      <path d="M264 352 V468 M214 410 H314" stroke="#8AA7B6" stroke-width="4"/>
      <rect x="415" y="342" width="116" height="290" fill="#F4F7F8" stroke="#0B2D45" stroke-width="5"/>
      <rect x="438" y="374" width="70" height="86" fill="#C9DCE4" stroke="#0B2D45" stroke-width="4"/>
      <circle cx="504" cy="494" r="7" fill="#007A3D"/>
    </g>

    <g id="foundation-cutaway">
      <path d="M140 532 H590 V785 H140 Z" fill="#CFD8DD" stroke="#0B2D45" stroke-width="5"/>
      <path d="M172 566 H558 V750 H172 Z" fill="#F4F7F8" stroke="#9EB0BA" stroke-width="3"/>
      <path d="M172 674 H558" stroke="#D7E0E5" stroke-width="5"/>
      <rect x="215" y="590" width="170" height="18" rx="8" fill="#D7E0E5"/>
      <path d="M258 608 V682 Q258 704 280 704 H356" fill="none" stroke="#1C6B97" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="373" cy="704" r="18" fill="#FFFFFF" stroke="#1C6B97" stroke-width="9"/>
    </g>
  </g>

  <g id="property-boundary">
    <path class="boundary" d="M1016 330 V822"/>
    <path d="M995 330 H1037 M995 822 H1037" stroke="#007A3D" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g id="sewer-system">
    <g id="residential-sewer-lateral">
      <path d="M356 704 C505 704 590 726 708 758 C842 794 934 814 1056 832 C1138 844 1206 860 1280 893" fill="none" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round"/>
      <path d="M356 704 C505 704 590 726 708 758 C842 794 934 814 1056 832 C1138 844 1206 860 1280 893" fill="none" stroke="#1C6B97" stroke-width="29" stroke-linecap="round"/>
      <path d="M480 714 C620 731 715 770 831 792" fill="none" stroke="#007A3D" stroke-width="6" stroke-linecap="round" marker-end="url(#flow-arrow)"/>
    </g>

    <g id="connection-point">
      <path d="M1260 892 Q1286 870 1312 890" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>
      <circle cx="1284" cy="894" r="24" fill="#007A3D" stroke="#FFFFFF" stroke-width="7"/>
    </g>

    <g id="public-sewer-main">
      <path d="M1245 902 C1352 929 1476 922 1608 894" fill="none" stroke="#FFFFFF" stroke-width="104" stroke-linecap="round"/>
      <path d="M1245 902 C1352 929 1476 922 1608 894" fill="none" stroke="#0B2D45" stroke-width="88" stroke-linecap="round"/>
      <path d="M1260 902 C1360 925 1478 916 1596 893" fill="none" stroke="#294B61" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    </g>
  </g>

  <g id="callouts">
    <g id="callout-building-connection">
      <path class="leader" d="M390 708 L520 640 L520 588"/>
      <circle class="dot" cx="390" cy="708" r="9"/>
      <text class="label" x="420" y="550">Building sewer</text>
      <text class="label" x="420" y="580">connection</text>
    </g>

    <g id="callout-lateral">
      <path class="leader" d="M752 772 L752 672 L676 672"/>
      <circle class="dot" cx="752" cy="772" r="9"/>
      <text class="label" x="615" y="630">Residential sewer lateral</text>
      <text class="small" x="615" y="660">One continuous building-to-main line</text>
    </g>

    <g id="callout-property-boundary">
      <path class="leader" d="M1016 518 L930 472"/>
      <circle class="dot" cx="1016" cy="518" r="9"/>
      <text class="label" x="756" y="445">Property boundary</text>
      <text class="small" x="756" y="476">Shown for orientation only</text>
    </g>

    <g id="callout-sidewalk-street">
      <path class="leader" d="M1154 596 L1188 426 L1330 426"/>
      <circle class="dot" cx="1154" cy="596" r="9"/>
      <text class="label" x="1194" y="388">Sidewalk and street</text>
    </g>

    <g id="callout-connection-point">
      <path class="leader" d="M1284 894 L1182 1014 L1070 1014"/>
      <circle class="dot" cx="1284" cy="894" r="9"/>
      <text class="label" x="860" y="1006">Connection point</text>
      <text class="small" x="860" y="1038">Lateral enters the larger main</text>
    </g>

    <g id="callout-public-main">
      <path class="leader" d="M1442 916 L1468 1032"/>
      <circle class="dot" cx="1442" cy="916" r="9"/>
      <text class="label" x="1284" y="1083">Public sewer main</text>
      <text class="small" x="1284" y="1114">Beneath the roadway</text>
    </g>
  </g>

  <g id="legend" transform="translate(92 1002)">
    <rect x="0" y="0" width="510" height="112" rx="18" fill="#FFFFFF" stroke="#D7E0E5" stroke-width="3"/>
    <path d="M30 38 H92" stroke="#1C6B97" stroke-width="18" stroke-linecap="round"/>
    <text class="small" x="112" y="45">Residential sewer lateral</text>
    <path d="M30 78 H92" stroke="#0B2D45" stroke-width="28" stroke-linecap="round"/>
    <text class="small" x="112" y="85">Public sewer main</text>
  </g>
</svg>
