<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="diagram-title diagram-desc" preserveAspectRatio="xMidYMid meet">
  <title id="diagram-title">Residential sewer lateral and public sewer main</title>
  <desc id="diagram-desc">A general educational side-view cutaway showing a Las Vegas Valley home, exterior cleanout, private sewer lateral, property boundary, street, and connection to a public sewer main. Sewer authority and responsibility vary by property location.</desc>

  <defs>
    <style>
      .navy-line { stroke: #0B2D45; }
      .blue-line { stroke: #1C6B97; }
      .green-line { stroke: #007A3D; }
      .outline { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .label { fill: #0B2D45; font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; }
      .small-label { fill: #0B2D45; font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; }
      .note { fill: #38556A; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 400; }
    </style>
    <marker id="flow-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#007A3D"/>
    </marker>
  </defs>

  <rect width="1600" height="1200" fill="#F4F7F8"/>
  <path d="M0 490H1600V920H0Z" fill="#E8DDCE"/>
  <path d="M0 490H1600" class="outline navy-line" stroke-width="4"/>

  <g id="residence" aria-label="Home and building drain">
    <path d="M105 485V282L330 130L555 282V485Z" fill="#FFFFFF" class="navy-line" stroke-width="5" stroke-linejoin="round"/>
    <path d="M78 300L330 130L582 300" class="outline navy-line" stroke-width="12"/>
    <path d="M140 485V316H520V485" fill="#EEE5D8" class="navy-line" stroke-width="4"/>
    <rect x="190" y="335" width="104" height="150" rx="4" fill="#FFFFFF" class="navy-line" stroke-width="4"/>
    <rect x="367" y="330" width="108" height="82" rx="4" fill="#DCEAF2" class="navy-line" stroke-width="4"/>
    <path d="M421 330V412M367 371H475" class="outline navy-line" stroke-width="3"/>
    <path d="M150 485H550V600H150Z" fill="#D7E0E5" class="navy-line" stroke-width="4"/>
    <path d="M265 356V540H476V575" class="outline blue-line" stroke-width="12"/>
    <circle cx="265" cy="356" r="11" fill="#FFFFFF" class="blue-line" stroke-width="5"/>
    <text x="330" y="236" text-anchor="middle" class="label">Home</text>
  </g>

  <g id="yard" aria-label="Residential yard">
    <path d="M550 490H1060V550H550Z" fill="#C8D8B7"/>
    <path d="M585 490V454M575 466L585 454L595 466M690 490V462M680 474L690 462L700 474M830 490V456M820 468L830 456L840 468" class="outline green-line" stroke-width="4"/>
    <path d="M550 550H1060" class="outline navy-line" stroke-width="3" opacity="0.45"/>
  </g>

  <g id="cleanout" aria-label="Exterior cleanout">
    <path d="M620 600V490" class="outline blue-line" stroke-width="15"/>
    <path d="M594 490H646" class="outline navy-line" stroke-width="9"/>
    <rect x="596" y="462" width="48" height="28" rx="6" fill="#FFFFFF" class="navy-line" stroke-width="4"/>
    <path d="M620 600V625" class="outline blue-line" stroke-width="15"/>
    <path d="M620 462V420" class="outline green-line" stroke-width="3"/>
    <rect x="555" y="362" width="130" height="58" rx="10" fill="#FFFFFF" class="green-line" stroke-width="3"/>
    <text x="620" y="399" text-anchor="middle" class="small-label">Cleanout</text>
  </g>

  <g id="private-lateral" aria-label="Private sewer lateral">
    <path d="M476 575L560 625H970L1140 720" class="outline blue-line" stroke-width="24"/>
    <path d="M476 575L560 625H970L1140 720" class="outline" stroke="#FFFFFF" stroke-width="7" opacity="0.9"/>
    <path d="M570 625H900" class="outline green-line" stroke-width="5" marker-end="url(#flow-arrow)"/>
    <path d="M770 625V690" class="outline blue-line" stroke-width="3"/>
    <rect x="623" y="690" width="294" height="62" rx="12" fill="#FFFFFF" class="blue-line" stroke-width="3"/>
    <text x="770" y="730" text-anchor="middle" class="small-label">Private sewer lateral</text>
  </g>

  <g id="property-boundary" aria-label="Property boundary">
    <path d="M1018 360V846" class="outline green-line" stroke-width="4" stroke-dasharray="14 12"/>
    <path d="M985 360H1051" class="outline green-line" stroke-width="5"/>
    <rect x="862" y="280" width="312" height="64" rx="12" fill="#FFFFFF" class="green-line" stroke-width="3"/>
    <text x="1018" y="321" text-anchor="middle" class="small-label">Property boundary</text>
  </g>

  <g id="street" aria-label="Sidewalk and street">
    <path d="M1060 490H1160V555H1060Z" fill="#D7E0E5" class="navy-line" stroke-width="3"/>
    <path d="M1160 455H1600V555H1160Z" fill="#AEBBC3" class="navy-line" stroke-width="3"/>
    <path d="M1160 555V580H1600V555" fill="#BFCAD0" class="navy-line" stroke-width="3"/>
    <path d="M1240 505H1350M1440 505H1550" class="outline" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="46 30"/>
    <rect x="1260" y="354" width="190" height="64" rx="12" fill="#FFFFFF" class="navy-line" stroke-width="3"/>
    <text x="1355" y="395" text-anchor="middle" class="label">Street</text>
    <text x="1110" y="446" text-anchor="middle" class="small-label">Sidewalk</text>
  </g>

  <g id="connection" aria-label="Connection between the lateral and public main">
    <path d="M1120 710L1192 750" class="outline blue-line" stroke-width="24"/>
    <circle cx="1196" cy="752" r="28" fill="#FFFFFF" class="green-line" stroke-width="8"/>
    <circle cx="1196" cy="752" r="10" fill="#007A3D"/>
  </g>

  <g id="public-main" aria-label="Public sewer main">
    <path d="M1180 752H1580" class="outline navy-line" stroke-width="82"/>
    <path d="M1180 752H1580" class="outline" stroke="#FFFFFF" stroke-width="32"/>
    <path d="M1320 752H1485" class="outline green-line" stroke-width="5" marker-end="url(#flow-arrow)"/>
    <path d="M1390 793V842" class="outline navy-line" stroke-width="3"/>
    <rect x="1247" y="842" width="286" height="62" rx="12" fill="#FFFFFF" class="navy-line" stroke-width="3"/>
    <text x="1390" y="882" text-anchor="middle" class="small-label">Public sewer main</text>
  </g>

  <g id="educational-note" aria-label="Important educational note">
    <rect x="90" y="982" width="1420" height="132" rx="18" fill="#FFFFFF" class="navy-line" stroke-width="3"/>
    <circle cx="146" cy="1048" r="25" fill="#007A3D"/>
    <text x="146" y="1057" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">i</text>
    <text x="192" y="1038" class="note">
      <tspan x="192" dy="0">General educational diagram. Sewer authority and responsibility can vary by property location.</tspan>
      <tspan x="192" dy="36">Confirm requirements with the applicable local utility before making service or repair decisions.</tspan>
    </text>
  </g>
</svg>
